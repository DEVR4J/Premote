name: Build and release Phone APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q -o phone-app.zip -d src
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "3.24.5", channel: stable }
      - name: Use the fixed signing key (needed so updates install over older versions)
        run: |
          mkdir -p ~/.android
          cp src/ci/debug.keystore ~/.android/debug.keystore
      - name: Build phone APK
        working-directory: src
        run: |
          mkdir /tmp/keep && cp -r lib pubspec.yaml /tmp/keep/
          flutter create --platforms=android --org com.example --project-name tv_remote .
          rm -rf lib test && cp -r /tmp/keep/lib . && cp /tmp/keep/pubspec.yaml .
          cp -r phone_icons/* android/app/src/main/res/
          find android/app/src/main -name 'MainActivity.*' -delete
          mkdir -p android/app/src/main/kotlin/com/example/tv_remote
          cp android_native/*.kt android/app/src/main/kotlin/com/example/tv_remote/
          sed -i "s|OWNER/REPO|${{ github.repository }}|; s|const int kBuild = 0;|const int kBuild = ${{ github.run_number }};|" lib/update.dart
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>\n    <uses-permission android:name="android.permission.CHANGE_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_CONNECTED_DEVICE"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/>\n    <application android:usesCleartextTraffic="true"|' android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="[^"]*"|android:label="ATC Phone"|' android/app/src/main/AndroidManifest.xml
          sed -i 's|</application>|<service android:name=".KeepAliveService" android:exported="false" android:foregroundServiceType="connectedDevice"/>\n    </application>|' android/app/src/main/AndroidManifest.xml
          flutter pub get
          flutter build apk --release --no-shrink --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }}
      - name: Name the APK
        run: cp src/build/app/outputs/flutter-apk/app-release.apk ATC-Phone.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ATC Phone v1.0.${{ github.run_number }}
          files: ATC-Phone.apk
          make_latest: true
