name: Build Advocate APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Advocate project
        run: |
          unzip -q Advocate-app-ecourts-sync.zip -d extracted
          test -f extracted/Advocate-app/package.json
          test -f extracted/Advocate-app/android/gradlew

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        working-directory: extracted/Advocate-app
        run: npm ci

      - name: Build web application
        working-directory: extracted/Advocate-app
        run: npm run build

      - name: Synchronize Capacitor
        working-directory: extracted/Advocate-app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: extracted/Advocate-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Advocate-APK
          path: extracted/Advocate-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
